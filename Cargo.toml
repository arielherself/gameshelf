[package]
name = "gameshelf"
version = "0.1.0"
edition = "2024"
description = "A TUI game launcher for Windows games via umu-launcher and Proton"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/arielherself/gameshelf"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.190"
liblzma = { version = "0.4.8", default-features = false, features = ["static"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
strsim = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

# Image decoding and scaling are unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
